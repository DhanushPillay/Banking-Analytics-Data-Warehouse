<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jury 2 system architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #666666;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; }
  .diagram-container { width: 100%; max-width: 1280px; margin: 0 auto; overflow-x: auto; }
  svg { width: 100%; min-width: 1280px; display: block; }
  @media print { svg { min-width: 0; } }
  .page-title { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 24px; fill: #1a1a1a; }
  .page-sub { font-family: 'Geist Mono', monospace; font-size: 11px; fill: #666; }
  .band-label { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 16px; fill: #1a1a1a; }
  .node-title { font-family: 'Geist', sans-serif; font-weight: 600; font-size: 14px; }
  .node-sub { font-family: 'Geist Mono', monospace; font-size: 10px; }
  .note { font-family: 'Geist Mono', monospace; font-size: 9px; }
  .flow { stroke: #4a4a4a; stroke-width: 1.5; fill: none; }
  .bus { stroke: #4a4a4a; stroke-width: 1.2; fill: none; }
</style>
</head>
<body>
<div class="diagram-container">
<svg viewBox="0 0 1280 720" role="img" aria-labelledby="jury2-architecture-title jury2-architecture-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="jury2-architecture-title">Jury 2 architecture: loan history to default probability</title>
  <desc id="jury2-architecture-desc">A four-column architecture diagram: PKDD'99 source tables feed feature engineering, model training and selection, out-of-fold scores, and a Streamlit decision console.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <!-- title -->
  <text class="page-title" x="40" y="38">Jury 2 system architecture</text>
  <text class="page-sub" x="40" y="58">Customer Behavioral Analysis &amp; Loan Default Classification · PKDD'99 · 682 loans · 76 defaults</text>

  <!-- bands -->
  <rect x="40" y="76" width="280" height="584" fill="#eaf1f8"/>
  <rect x="320" y="76" width="300" height="584" fill="#e0f3ef"/>
  <rect x="620" y="76" width="300" height="584" fill="#fdf1e0"/>
  <rect x="920" y="76" width="320" height="584" fill="#ece9f8"/>

  <!-- band headers -->
  <text class="band-label" x="180" y="108" text-anchor="middle">Data Sources</text>
  <text class="band-label" x="470" y="108" text-anchor="middle">Feature Engineering</text>
  <text class="band-label" x="770" y="108" text-anchor="middle">Modeling</text>
  <text class="band-label" x="1080" y="108" text-anchor="middle">Serving</text>

  <!-- arrows: data to features -->
  <path class="flow" d="M 280 190 H 356" marker-end="url(#arrow)"/>
  <path class="flow" d="M 280 310 H 356" marker-end="url(#arrow)"/>
  <path class="flow" d="M 280 430 H 356" marker-end="url(#arrow)"/>

  <!-- feature bus -->
  <path class="bus" d="M 580 190 H 625"/>
  <path class="bus" d="M 580 310 H 625"/>
  <path class="bus" d="M 580 430 H 625"/>
  <path class="bus" d="M 625 190 V 430"/>
  <path class="flow" d="M 625 210 H 656" marker-end="url(#arrow)"/>

  <!-- training to selection -->
  <path class="flow" d="M 770 270 V 306" marker-end="url(#arrow)"/>

  <!-- selection to scores -->
  <path class="flow" d="M 880 370 H 966" marker-end="url(#arrow)"/>

  <!-- scores to app -->
  <path class="flow" d="M 1080 430 V 466" marker-end="url(#arrow)"/>

  <!-- data source nodes -->
  <g>
    <rect x="80" y="150" width="200" height="80" rx="4" fill="#ffffff" stroke="#b9c9da" stroke-width="1"/>
    <g transform="translate(92,174)" stroke="#4a6fa5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="16" cy="6" rx="10" ry="4"/>
      <path d="M6 6 V25 C6 30 26 30 26 25 V6"/>
      <path d="M6 15 C6 20 26 20 26 15"/>
      <path d="M6 22 C6 27 26 27 26 22"/>
    </g>
    <text class="node-title" x="136" y="186" fill="#1a1a1a">loan.csv</text>
    <text class="node-sub" x="136" y="204" fill="#666">682 applications</text>

    <rect x="80" y="270" width="200" height="80" rx="4" fill="#ffffff" stroke="#b9c9da" stroke-width="1"/>
    <g transform="translate(92,294)" stroke="#4a6fa5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="16" cy="6" rx="10" ry="4"/>
      <path d="M6 6 V25 C6 30 26 30 26 25 V6"/>
      <path d="M6 15 C6 20 26 20 26 15"/>
      <path d="M6 22 C6 27 26 27 26 22"/>
    </g>
    <text class="node-title" x="136" y="306" fill="#1a1a1a">trans.csv</text>
    <text class="node-sub" x="136" y="324" fill="#666">1.06M transactions</text>

    <rect x="80" y="390" width="200" height="80" rx="4" fill="#ffffff" stroke="#b9c9da" stroke-width="1"/>
    <g transform="translate(92,414)" stroke="#4a6fa5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="10" r="5"/>
      <path d="M3 27 C3 20 21 20 21 27"/>
      <circle cx="24" cy="12" r="3.5"/>
      <path d="M21 22 C22 19 30 19 31 24"/>
    </g>
    <text class="node-title" x="136" y="426" fill="#1a1a1a">client / account</text>
    <text class="node-sub" x="136" y="444" fill="#666">5.4k records</text>
  </g>

  <!-- feature nodes -->
  <g>
    <rect x="360" y="150" width="220" height="80" rx="4" fill="#1f7a6f"/>
    <text class="node-title" x="372" y="186" fill="#ffffff">Loan terms</text>
    <text class="node-sub" x="372" y="204" fill="rgba(255,255,255,0.85)">amount · duration · payments</text>

    <rect x="360" y="270" width="220" height="80" rx="4" fill="#1f7a6f"/>
    <text class="node-title" x="372" y="306" fill="#ffffff">Behavioral aggregates</text>
    <text class="node-sub" x="372" y="324" fill="rgba(255,255,255,0.85)">balance · flow · activity</text>

    <rect x="360" y="390" width="220" height="80" rx="4" fill="#1f7a6f"/>
    <text class="node-title" x="372" y="426" fill="#ffffff">Demographics</text>
    <text class="node-sub" x="372" y="444" fill="rgba(255,255,255,0.85)">age · gender</text>
  </g>

  <!-- model nodes -->
  <g>
    <rect x="660" y="150" width="220" height="120" rx="4" fill="#e9a23b"/>
    <text class="node-title" x="672" y="196" fill="#2b1d0a">Model training</text>
    <text class="node-sub" x="672" y="214" fill="#4a3518">6 classifiers × 24 configs</text>
    <text class="node-sub" x="672" y="232" fill="#4a3518">DT · RF · GB · SVM · KNN · NB</text>

    <rect x="660" y="310" width="220" height="120" rx="4" fill="#e9a23b"/>
    <text class="node-title" x="672" y="356" fill="#2b1d0a">Model selection</text>
    <text class="node-sub" x="672" y="374" fill="#4a3518">5×10 repeated CV · F1</text>
    <text class="node-sub" x="672" y="392" fill="#4a3518">winner: GradientBoosting</text>
  </g>

  <!-- serving nodes -->
  <g>
    <rect x="970" y="310" width="220" height="120" rx="4" fill="#6f5bb0"/>
    <text class="node-title" x="982" y="356" fill="#ffffff">Out-of-fold scores</text>
    <text class="node-sub" x="982" y="374" fill="rgba(255,255,255,0.85)">682 probabilities</text>
    <text class="node-sub" x="982" y="392" fill="rgba(255,255,255,0.85)">5-fold OOF · not in-sample</text>

    <rect x="970" y="470" width="220" height="120" rx="4" fill="#6f5bb0"/>
    <text class="node-title" x="982" y="516" fill="#ffffff">Streamlit console</text>
    <text class="node-sub" x="982" y="534" fill="rgba(255,255,255,0.85)">8 pages · overview · EDA</text>
    <text class="node-sub" x="982" y="552" fill="rgba(255,255,255,0.85)">simulator · risk queue</text>
  </g>

  <!-- notes -->
  <circle cx="82" cy="516" r="3" fill="#c02f35"/>
  <text class="note" x="92" y="520" fill="#8a2f34">76 defaults · 11.1% base rate</text>

  <circle cx="350" cy="516" r="3" fill="#1f7a6f"/>
  <text class="note" x="360" y="520" fill="#1f7a6f">txn_date &lt; loan_date</text>

  <circle cx="662" cy="516" r="3" fill="#b86e1f"/>
  <text class="note" x="672" y="520" fill="#8a5a18">tuned on train · refit on full</text>

  <text class="note" x="970" y="620" fill="#6b5aa8">local CSV artifacts · no live scoring</text>
</svg>
</div>
</body>
</html>
